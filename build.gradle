plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = '_2024.winter'
version = '0.0.1-SNAPSHOT'

ext {
    springCloudVersion = "2024.0.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // feign-client
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // h2-db
    runtimeOnly 'com.h2database:h2'

    // spock test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    testImplementation 'org.spockframework:spock-core:2.4-M4-groovy-4.0'
    testImplementation 'org.spockframework:spock-spring:2.4-M4-groovy-4.0'

    // hotswap
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // QueryDsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"


    // web client
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind' // JSON 변환
    implementation 'org.springframework.boot:spring-boot-starter-json' // Jackson 지원

    // jsoup
    implementation 'org.jsoup:jsoup:1.14.3' // Jsoup 의존성
    implementation 'org.springframework.boot:spring-boot-starter-reactor-netty' // 비동기 HTTP 클라이언트용

}

tasks.named('test') {
    useJUnitPlatform()
}
